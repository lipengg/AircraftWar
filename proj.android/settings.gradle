include ':libcocos2dx'
// 引擎目录：优先环境变量 COCOS2DX_ROOT（独立安装的引擎根目录），未设置时回退到工程内嵌 cocos2d/
def cocosRoot = System.getenv("COCOS2DX_ROOT") ?: new File(settingsDir, '../cocos2d').absolutePath
project(':libcocos2dx').projectDir = new File(cocosRoot, 'cocos/platform/android/libcocos2dx')
include ':AircraftWar'
project(':AircraftWar').projectDir = new File(settingsDir, 'app')
